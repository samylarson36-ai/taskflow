
services:
  taskflow:
    build: .
    image: taskflow:1.1
    container_name: taskflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TASKFLOW_DB_PATH: /data/taskflow.db
    volumes:
      - taskflow_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - taskflow

  grafana:
    image: grafana/grafana:latest
    container_name: taskflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  taskflow_data:
  prometheus_data:
  grafana_data:
